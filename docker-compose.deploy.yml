# Production-ish deploy: single always-on Slack agent over Socket Mode.
#
# Differs from the dev docker-compose.yml on purpose:
#   - runs the Socket Mode entrypoint (no public URL / inbound port needed)
#   - Postgres on by default (durable memory + sessions + workflows)
#   - no Redis (not used by the runtime yet)
#   - restart: unless-stopped so it survives reboots
#
# Usage on the server:
#   cp .env.example .env                   # Compose/deployment values
#   # Edit configs/prd/runtime.env, select a recorded release so OPENLOOP_IMAGE
#   # names a digest (docs/operations/releases.md), then run Compose under
#   # Doppler so the declared secret environment sources are present.
#   mise run secrets-invoke -- docker compose -f docker-compose.deploy.yml up -d
#   docker compose -f docker-compose.deploy.yml logs -f runtime
#
# This file never builds: image production lives in docker-compose.build.yml so
# a deployment can only consume the digest a release recorded.
#
# The runtime intentionally has no Docker-daemon authority. Containerized
# OpenHands requires the external broker override.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openloop}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: ${POSTGRES_DB:-openloop}
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openloop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  runtime:
    image: ${OPENLOOP_IMAGE:-openloop:local}
    restart: unless-stopped
    env_file:
      - ./configs/prd/runtime.env
    # Derive the DB URL from the same vars Postgres uses, pointed at the
    # in-network service host. Overrides DATABASE_URL from the tracked runtime
    # config so a direct-execution value cannot leak in.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openloop}@postgres:5432/${POSTGRES_DB:-openloop}
      GITHUB_APP_PRIVATE_KEY_PATH: /run/secrets/github_app_private_key
      LOG_LEVEL: ${LOG_LEVEL:-info}
      STORAGE_MODE: postgres
      # Which recorded release this container is running, so a live deployment
      # can be matched to its record without inspecting the host.
      RELEASE_ID: ${OPENLOOP_RELEASE_ID:-}
    secrets:
      - postgres_password
      - openai_api_key
      - anthropic_api_key
      # Uncomment when GEMINI_API_KEY is present in the runtime Doppler project.
      # - gemini_api_key
      - groq_api_key
      - openrouter_api_key
      - slack_bot_token
      # Uncomment for HTTP Slack events; Socket Mode does not require it.
      # - slack_signing_secret
      - slack_app_token
      - github_token
      - github_app_private_key
      - claude_code_oauth_token
      - coding_worker_openhands_state_master_key
      - broker_identity_private_key
      - broker_receipt_roots
    # Socket Mode opens an OUTBOUND WebSocket to Slack — no inbound port.
    command: openloop slack socket
    depends_on:
      postgres:
        condition: service_healthy
    # Agent definitions are configuration, not image content: edit agents/*.yaml
    # and `docker compose ... restart runtime` — no rebuild. Record the new
    # runtime-config revision against the same image digest afterwards.
    volumes:
      - ./agents:/app/agents:ro

volumes:
  pgdata:

secrets:
  postgres_password:
    environment: POSTGRES_PASSWORD
  openai_api_key:
    environment: OPENAI_API_KEY
  anthropic_api_key:
    environment: ANTHROPIC_API_KEY
  # gemini_api_key:
  #   environment: GEMINI_API_KEY
  groq_api_key:
    environment: GROQ_API_KEY
  openrouter_api_key:
    environment: OPENROUTER_API_KEY
  slack_bot_token:
    environment: SLACK_BOT_TOKEN
  # slack_signing_secret:
  #   environment: SLACK_SIGNING_SECRET
  slack_app_token:
    environment: SLACK_APP_TOKEN
  github_token:
    environment: GITHUB_TOKEN
  github_app_private_key:
    environment: GITHUB_APP_PRIVATE_KEY
  claude_code_oauth_token:
    environment: CLAUDE_CODE_OAUTH_TOKEN
  coding_worker_openhands_state_master_key:
    environment: CODING_WORKER_OPENHANDS_STATE_MASTER_KEY
  broker_identity_private_key:
    environment: BROKER_IDENTITY_PRIVATE_KEY
  broker_receipt_roots:
    environment: BROKER_RECEIPT_ROOTS
