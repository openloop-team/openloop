# The runtime never receives Docker-daemon access. Containerized OpenHands is
# available only through the external broker override.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-openloop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-openloop}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-openloop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  runtime:
    build: .
    env_file: .env.runtime
    environment:
      # Compose owns database bootstrap values in .env. Override the localhost
      # URL used by direct Python execution with the in-network service host.
      # Keep the raw password outside the URI so URL-significant characters are
      # passed to PostgreSQL unchanged.
      DATABASE_URL: postgresql://${POSTGRES_USER:-openloop}@postgres:5432/${POSTGRES_DB:-openloop}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./agents:/app/agents:ro
      # GitHub App auth: mount the App private key and set
      # GITHUB_APP_PRIVATE_KEY_PATH=/run/secrets/github-app.pem in .env.runtime.
      - ./secrets/github-app.pem:/run/secrets/github-app.pem:ro
    command: uvicorn openloop.app:app --host 0.0.0.0 --port 8000

volumes:
  pgdata:
