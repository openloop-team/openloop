name: Promote image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

# Serializes promotions of one version tag. The destination check is a read
# followed by a write: without this, two runs for a force-moved tag could both
# see an absent destination and both create it. queue: max because the default
# cancels a pending run, which would drop the second promotion silently instead
# of letting it observe the first run's digest and fail.
concurrency:
  group: promote-${{ github.ref_name }}
  cancel-in-progress: false
  queue: max

jobs:
  promote:
    name: Promote to a version tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release

    permissions:
      contents: read
      packages: write
      attestations: read

    env:
      IMAGE: ghcr.io/openloop-team/openloop
      REPO: openloop-team/openloop

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Anchored ASCII, not [\w][\w.-]{0,127}: \w is engine-defined, so a
      # non-ASCII tag could pass here and still be rejected by GHCR. Rejecting
      # beats sanitizing — a release handle that silently differs from its Git
      # tag is worse than a failed promotion.
      - name: Validate the tag as an OCI reference
        run: |
          set -euo pipefail
          if ! printf '%s' "$GITHUB_REF_NAME" \
            | LC_ALL=C grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
            echo "::error::$GITHUB_REF_NAME is not a legal OCI tag"
            exit 1
          fi

      - name: Resolve the digest published for this commit
        id: source
        run: |
          set -euo pipefail
          digest="$(docker buildx imagetools inspect "$IMAGE:main-$GITHUB_SHA" \
            --format '{{println .Manifest.Digest}}')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # oci:// is what marks this as a registry image; a bare reference is read
      # as a filesystem path. --signer-workflow is repository-qualified, and
      # --source-digest is what binds the attestation to this exact commit
      # rather than to any main build.
      - name: Verify the image's attestation
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh attestation verify \
            "oci://$IMAGE@$DIGEST" \
            --repo "$REPO" \
            --signer-workflow "$REPO/.github/workflows/ci.yml" \
            --source-ref refs/heads/main \
            --source-digest "$GITHUB_SHA"

      # Created from the captured digest, never from :main-<sha>: that tag can
      # move between verification and write.
      - name: Attach the version tag
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail
          target="$IMAGE:$GITHUB_REF_NAME"
          existing="$(docker buildx imagetools inspect "$target" \
            --format '{{println .Manifest.Digest}}' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            docker buildx imagetools create --tag "$target" "$IMAGE@$DIGEST"
          elif [ "$existing" != "$DIGEST" ]; then
            echo "::error::$target already points at $existing, not $DIGEST"
            exit 1
          fi

      # Detects a write that overlapped this promotion. It cannot prevent a
      # later one: immutability rests on package write access being limited to
      # this repository's Actions.
      - name: Confirm the version tag resolves to the promoted digest
        env:
          DIGEST: ${{ steps.source.outputs.digest }}
        run: |
          set -euo pipefail
          final="$(docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME" \
            --format '{{println .Manifest.Digest}}')"
          test "$final" = "$DIGEST"
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
