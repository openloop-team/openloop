[project]
name = "pyopenloop"
dynamic = ["version"]
description = "The open-source control plane and runtime for team AI agents"
authors = [
  { name = "Artur Maciag", email = "maciag.artur@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.14.0",
    "pyyaml>=6.0",
    "litellm>=1.40",
    "slack-bolt>=1.18",
    # chat_postMessage(markdown_text=...) — standard-Markdown rendering — needs 3.33+.
    "slack-sdk>=3.33",
    # The dialect's driver. No project module imports it — SQLAlchemy is the
    # only thing that calls into it.
    "asyncpg>=0.29",
    # [asyncio] is greenlet, which SQLAlchemy's async layer runs on and does
    # not install unconditionally.
    "sqlalchemy[asyncio]>=2.0.51",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    # Exact pins, unlike everything else here: these two decide whether CI is
    # green, so a patch release that adds a rule or changes formatting must
    # arrive as a reviewable bump rather than as a red build on an unrelated PR.
    "ruff==0.16.0",
    "mypy==2.3.0",
]
mcp = [
    "mcp>=1.0",
]
redis = [
    "redis>=5.0",
]
githubapp = [
    "pyjwt[crypto]>=2.8",
]
broker = [
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
]

[dependency-groups]
# The heavy agentic worker backend (CODING_WORKER_BACKEND=openhands). A
# dependency group, NOT an extra: `openhands-sdk` is pinned to a fork commit
# carrying the injectable WebSocket client factory the UDS relay needs, and
# PyPI rejects any distribution whose metadata declares a direct reference.
# Groups are local-only and never reach published metadata, so this keeps the
# pin while leaving the project publishable. Revisit when
# OpenHands/software-agent-sdk#4135 lands upstream and the pin can name a
# released version instead.
# openhands-workspace is only needed for the docker-mounted runtime.
# The SDK needs Python >=3.12 (the project floor stays 3.11; on 3.11 the
# group resolves empty and the backend probe fails closed at boot).
openhands = [
    # Pin the server package directly: openhands-workspace only declares a
    # compatible lower bound, so plain pip would otherwise install a newer
    # agent-server than the private 1.36.0 adapter supports.
    "openhands-agent-server==1.36.0; python_version >= '3.12'",
    # websocket client factory
    "openhands-sdk @ git+https://github.com/openloop-team/software-agent-sdk.git@d4e3d7be3c66336e834cde63ed62f22fbccc274f#subdirectory=openhands-sdk ; python_version >= '3.12'",
    "openhands-tools==1.36.0; python_version >= '3.12'",
    "openhands-workspace==1.36.0; python_version >= '3.12'",
    # Direct dependency: Phase 0 workspace artifacts use streaming AES-256-GCM.
    "cryptography>=42; python_version >= '3.12'",
]

[project.scripts]
openloop = "openloop.cli:main"
openloop-broker = "openloop.broker_main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/openloop"]

[tool.hatch.version]
path = "src/openloop/__init__.py"

[tool.ruff]
# The packaging floor, not the 3.12 the CI runner happens to use: rules that
# rewrite to newer idioms must not propose anything a 3.11 install can't run.
target-version = "py311"

[tool.ruff.lint]
# E501 (line length) is deliberately absent. `ruff format` owns line width, and
# what it leaves long is the handful of cases it can't split — URLs, long string
# literals, comment prose — where a lint error would only invite worse wrapping.
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
files = ["src"]
python_version = "3.11"
# Check against the deployment target, not the developer's laptop. The broker
# reads SO_PEERCRED, which exists in the Linux socket stubs and not the macOS
# ones, so leaving this to the host would fail on a Mac and pass in CI.
platform = "linux"
# Third-party surface this repo leans on (litellm, slack_bolt, the openhands SDK)
# is largely unannotated or stub-less, and the openhands group doesn't even
# resolve on 3.11. Checking our own call sites is the win here; demanding stubs
# for other people's packages would just mean a wall of unactionable errors.
ignore_missing_imports = true

[[tool.mypy.overrides]]
# The openhands group requires >=3.12 and its sources use 3.12-only syntax, so
# checking this package under the 3.11 target above is a parse error before it
# is anything else. Our own call sites into it degrade to Any, which is what
# ignore_missing_imports would already have given us on a 3.11 install where the
# group resolves empty.
module = ["openhands.*"]
follow_imports = "skip"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# testpaths spans all three suites, so a bare `pytest` collects them together.
# The default prepend import mode derives module names relative to rootdir,
# which makes same-named files in two suite directories collide at collection
# (tests/unit and tests/e2e both hold a test_analysis_retirement.py).
addopts = "--import-mode=importlib"
consider_namespace_packages = true
markers = [
    "unit: isolated unit tests",
    "integration: in-process tests spanning runtime boundaries with fakes",
    "e2e: end-to-end tests spanning runtime boundaries",
    "postgres: tests that require reachable Postgres/pgvector",
    "live: tests that hit external model/provider or GitHub services",
    "serial: mutates shared schema (DDL) and must not run concurrently with other DB tests — keep the e2e suite serial",
]
