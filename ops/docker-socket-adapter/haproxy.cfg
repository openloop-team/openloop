global
  log stdout format raw local0
  maxconn 32
  hard-stop-after 10s

defaults
  log global
  mode tcp
  timeout connect 3s
  timeout client 1h
  timeout server 1h

frontend docker_socket
  mode tcp
  bind unix@/run/openloop-docker/docker.sock mode 0660
  default_backend docker_daemon

frontend adapter_health
  mode http
  bind unix@/run/openloop-health/health.sock mode 0600
  monitor-uri /healthz
  monitor fail if { nbsrv(docker_daemon) eq 0 }

backend docker_daemon
  mode tcp
  option httpchk
  http-check send meth GET uri /_ping ver HTTP/1.1 hdr Host docker
  http-check expect status 200
  server daemon unix@/var/run/docker.sock check inter 2s fall 2 rise 1
