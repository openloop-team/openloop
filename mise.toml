[tools]
python = "3.12"
uv = "0.11.32"
doppler = "3.76.1"

# Auto-create and activate a project virtualenv when entering the directory.
[env]
_.python.venv = { path = ".venv", create = true }

[tasks.install]
description = "Install the runtime with dependencies exercised by the test suite"
# `uv sync --locked`, not `uv pip install -e`: only sync reads uv.lock. Under
# pip-install the lockfile was decorative, every CI run re-resolved from the
# version ranges in pyproject, and a release of some transitive dependency could
# turn an unrelated PR red. --locked additionally fails rather than silently
# updating the lock, so a dependency change has to be committed to take effect.
run = "uv sync --locked --extra dev --extra broker --extra openhands"

[tasks.lint]
description = "Check lint rules (ruff)"
run = "ruff check src tests"

[tasks.lint-fix]
description = "Apply the lint fixes ruff can make automatically"
run = "ruff check src tests --fix"

[tasks.format]
description = "Format the source tree (ruff)"
run = "ruff format src tests"

[tasks.format-check]
description = "Verify the source tree is formatted, without rewriting it"
run = "ruff format --check src tests"

[tasks.typecheck]
description = "Type-check the runtime (mypy)"
run = "mypy"

[tasks.check]
description = "Run every gate CI runs: lint, format, types, then tests"
depends = ["lint", "format-check", "typecheck", "test"]

[tasks.compose-build]
description = "Fetch the pinned Docker adapter and build the shared OpenLoop image"
# The deploy and broker files only consume an image. Building goes through
# docker-compose.build.yml, which tags the local artifact; a production
# deployment selects a pushed digest instead (docs/operations/releases.md).
run = """
docker compose -f docker-compose.deploy.yml -f docker-compose.broker.yml pull docker-socket-adapter
docker compose -f docker-compose.build.yml build runtime
"""

[tasks.compose-up]
description = "Recreate the attached broker stack"
run = "docker compose -f docker-compose.deploy.yml -f docker-compose.broker.yml up --force-recreate docker-socket-adapter broker runtime --remove-orphans"

[tasks.compose-up-d]
description = "Recreate the detached broker stack"
run = """
docker compose -f docker-compose.deploy.yml -f docker-compose.broker.yml up -d --force-recreate docker-socket-adapter broker runtime --remove-orphans
"""

[tasks.compose-stop]
description = "Stop the Docker containers"
run = "docker compose -f docker-compose.deploy.yml -f docker-compose.broker.yml stop"

[tasks.compose-down]
description = "Bring down the containers and project volumes"
run = """
docker compose -f docker-compose.deploy.yml -f docker-compose.broker.yml down --remove-orphans --volumes
"""

[tasks.compose-logs]
description = "Follow the adapter, runtime, broker, and Postgres logs"
run = "docker compose -f docker-compose.deploy.yml -f docker-compose.broker.yml logs -f docker-socket-adapter runtime broker postgres"

[tasks.compose-ps]
description = "List the containers"
run = "docker compose -f docker-compose.deploy.yml -f docker-compose.broker.yml ps"

[tasks.compose-postgres-up]
description = "Start the compose Postgres and wait until it reports healthy"
run = """
docker compose up -d postgres
until [ "$(docker inspect --format '{% raw %}{{.State.Health.Status}}{% endraw %}' "$(docker compose ps -q postgres)")" = healthy ]; do sleep 2; done
"""

[tasks.compose-psql]
description = "Open a psql shell to the Postgres database"
run = "docker compose -f docker-compose.deploy.yml -f docker-compose.broker.yml exec postgres psql  -U openloop -d openloop"

[tasks.compose-python]
description = "Open a Python shell in the runtime container"
run = "docker compose -f docker-compose.deploy.yml -f docker-compose.broker.yml exec runtime python"

[tasks.secrets-download]
description = "Explain the injection-only secrets workflow"
run = """
echo "Secrets are injected into Compose and are not downloaded to plaintext files."
echo "Run: mise run secrets-invoke -- mise run compose-up"
"""

[tasks.secrets-invoke]
description = "Invoke a command with deploy, runtime, and broker Doppler values"
run = """
doppler run \
  --project openloop-deploy \
  --config dev_personal \
  -- \
doppler run \
  --project openloop-runtime \
  --config dev_personal \
  -- \
doppler run \
  --project openloop-broker \
  --config dev_personal \
  -- \
"""

[tasks.test]
description = "Run unit and integration tests"
run = "python -m pytest tests/unit tests/integration -q"

[tasks.test-unit]
description = "Run isolated unit tests"
run = "python -m pytest tests/unit -q"

[tasks.test-integration]
description = "Run in-process integration tests without external services"
run = "python -m pytest tests/integration -v"

# A disposable database on its own port, deliberately not the compose Postgres:
# these suites drop schemas and delete rows from shared tables, so they must
# never point at the development database. CI provisions the same thing as a
# service container.
[tasks.test-postgres-up]
description = "Start the disposable pgvector Postgres used by the test suites"
run = """
if [ -z "$(docker ps -q -f name='^openloop-test-postgres$')" ]; then
  docker rm -f openloop-test-postgres >/dev/null 2>&1 || true
  docker run -d --name openloop-test-postgres \
    -e POSTGRES_USER=openloop \
    -e POSTGRES_PASSWORD=openloop-test \
    -e POSTGRES_DB=openloop_test \
    -p 5433:5432 pgvector/pgvector:pg16 >/dev/null
fi
until docker exec openloop-test-postgres pg_isready -U openloop >/dev/null 2>&1; do sleep 1; done
"""

[tasks.test-postgres-down]
description = "Remove the disposable test Postgres and its data"
run = "docker rm -f openloop-test-postgres >/dev/null 2>&1 || true"

[tasks.test-postgres]
description = "Run the Postgres-backed suites against the disposable test database"
depends = ["test-postgres-up"]
run = "python -m pytest tests/e2e/test_postgres.py tests/e2e/test_analysis_retirement.py -v"

[tasks.test-e2e]
description = "Bring up Postgres and run Postgres E2E tests"
run = "mise run test-postgres"

[tasks.test-e2e-runtime-github-live]
description = "Run opt-in runtime/GitHub live E2E against a real model and GitHub"
run = """
if [ "${E2E_CONFIRM:-}" != "1" ]; then
  echo "Refusing to run runtime/GitHub live E2E. Set E2E_CONFIRM=1 after choosing a sandbox repo."
  exit 1
fi
if [ -z "${GITHUB_TOKEN:-}" ] || [ -z "${E2E_GITHUB_REPO:-}" ]; then
  echo "GITHUB_TOKEN and E2E_GITHUB_REPO are required."
  exit 1
fi
if [ -z "${E2E_MODEL:-}" ] && [ -z "${OPENAI_API_KEY:-}" ] && [ -z "${ANTHROPIC_API_KEY:-}" ]; then
  echo "Set E2E_MODEL or one provider key: OPENAI_API_KEY or ANTHROPIC_API_KEY."
  exit 1
fi
E2E_LIVE=1 python -m pytest tests/e2e/test_runtime_github_live.py -v
"""

[tasks.test-e2e-slack-live]
description = "Run opt-in Slack Socket Mode live E2E with a stubbed model"
run = """
if [ ! -f .env.e2e ]; then
  echo "Missing .env.e2e. Copy .env.e2e.example and fill in the test values."
  exit 1
fi
set -a
. ./.env.e2e
set +a
if [ "${E2E_CONFIRM:-}" != "1" ]; then
  echo "Refusing to run Slack live E2E. Set E2E_CONFIRM=1 after choosing a test channel."
  exit 1
fi
if [ -z "${SLACK_BOT_TOKEN:-}" ] || [ -z "${SLACK_APP_TOKEN:-}" ] || [ -z "${E2E_SLACK_USER_TOKEN:-}" ] || [ -z "${E2E_SLACK_CHANNEL:-}" ]; then
  echo "SLACK_BOT_TOKEN and SLACK_APP_TOKEN must be injected; E2E_SLACK_USER_TOKEN and E2E_SLACK_CHANNEL must be set in .env.e2e."
  exit 1
fi
E2E_LIVE=1 python -m pytest tests/e2e/test_slack_socket_live.py -v
"""

[tasks.dev]
description = "Run the FastAPI runtime with autoreload"
run = "python -m uvicorn openloop.app:app --reload"

[tasks.serve]
description = "Run the runtime (production-style, no reload)"
run = "python -m uvicorn openloop.app:app --host 0.0.0.0 --port 8000"

[tasks.apply]
description = "Validate an agent config, e.g. mise run apply -- -f agents/dev-platform.yaml"
run = "openloop agents apply"

[tasks.backlog]
description = "Show the ranked Next queue from the private board"
run = """
set -e
# NOTE: use printf, not echo — zsh's builtin echo expands the \\n escapes inside
# the JSON strings and corrupts the document before jq sees it.
items=$(gh project item-list 2 --owner openloop-team --format json --limit 200)
next=$(printf '%s' "$items" | jq -r '.items[] | select(.status == "Next")
  | "  \\(if .content.number then "#" + (.content.number|tostring) else "draft" end)\\t\\(.content.title // .title)"')
if [ -n "$next" ]; then
  printf 'Next:\\n%s\\n' "$next"
else
  printf 'Next: empty - nothing is ranked as next.\\n'
fi
printf '\\n'
printf '%s' "$items" | jq -r '[.items[] | select(.status == "Backlog")] | "Backlog: \\(length) items"'
printf '%s' "$items" | jq -r '[.items[] | select(.status == "Icebox")] | "Icebox:  \\(length) items"'
printf '\\nWorkstreams:\\n'
gh issue list --label workstream --json number,title --jq '.[] | "  #\\(.number)\\t\\(.title)"' | sort
"""
