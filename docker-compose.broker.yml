# External privileged broker override
#
# Usage:
#   cp .env.example .env
#   cp .env.runtime.example .env.runtime
#   cp .env.broker.example .env.broker
#   docker compose -f docker-compose.yml -f docker-compose.broker.yml up --build
#
# OPENLOOP_BROKER_ROOT must be an absolute host path. The one-shot init service
# creates the root when absent, then provisions its five children with the exact
# distinct-uid/shared-gid ownership matrix before either long-running service
# starts.
#
# TRUST PARTITION: `.env.runtime` belongs to runtime and may contain only
# app-side broker material (BROKER_IDENTITY_PRIVATE_KEY and
# BROKER_RECEIPT_ROOTS). `.env.broker` belongs to broker and may contain only
# broker-side roots/publics
# (BROKER_CAPABILITY_ROOTS, BROKER_RUNTIME_ROOTS,
# BROKER_IDENTITY_PUBLIC_KEYS, BROKER_RECEIPT_PUBLIC_KEYS). The Postgres DSN is
# injected from Compose-owned POSTGRES_* values in `.env`. Compose appends
# env_file values during merges, so broker-side secrets must never enter
# `.env.runtime` in the first place.
#
# This override keeps Docker authority inside the adapter/broker trust boundary.

x-openloop-build: &openloop-build
  context: .
  args:
    OPENLOOP_BROKER_UID: ${OPENLOOP_BROKER_UID:-10002}
    OPENLOOP_DATA_GID: ${OPENLOOP_DATA_GID:-10777}

services:
  # This is a permission shim, not a Docker API policy boundary. Any process
  # that can connect to its data UDS has root-equivalent daemon authority.
  docker-socket-adapter:
    image: haproxy@sha256:9f196dc9ec57310a1a430939221b33b36c14113497aca7ead9b13f4d5c2d37f5
    user: "0:${OPENLOOP_DATA_GID:-10777}"
    network_mode: none
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - type: bind
        source: ${DOCKER_SOCKET:-/var/run/docker.sock}
        target: /var/run/docker.sock
      - type: bind
        source: ./ops/docker-socket-adapter/haproxy.cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        read_only: true
      - type: volume
        source: docker-socket-adapter-data
        target: /run/openloop-docker
    tmpfs:
      - /run/openloop-health:rw,nosuid,nodev,noexec,size=64k,mode=0700
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          printf 'GET /healthz HTTP/1.0\r\nHost: localhost\r\n\r\n'
          | socat -t 3 - UNIX-CONNECT:/run/openloop-health/health.sock
          | grep -q '^HTTP/1\.[01] 200'
      interval: 2s
      timeout: 4s
      retries: 15
      start_period: 2s
    restart: unless-stopped

  broker-init:
    build: *openloop-build
    user: "0:0"
    command: python -m openloop.broker_provision
    environment:
      OPENLOOP_BROKER_ROOT: ${OPENLOOP_BROKER_ROOT:?}
      OPENLOOP_APP_UID: "1000"
      OPENLOOP_BROKER_UID: ${OPENLOOP_BROKER_UID:-10002}
      OPENLOOP_DATA_GID: ${OPENLOOP_DATA_GID:-10777}
    volumes:
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}
        target: ${OPENLOOP_BROKER_ROOT:?}
        bind:
          create_host_path: true
    restart: "no"

  broker:
    build: *openloop-build
    user: "${OPENLOOP_BROKER_UID:-10002}:${OPENLOOP_DATA_GID:-10777}"
    group_add:
      - ${OPENLOOP_DATA_GID:-10777}
    env_file: .env.broker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-openloop}@postgres:5432/${POSTGRES_DB:-openloop}
      PGPASSWORD: ${POSTGRES_PASSWORD:-change-me}
      DOCKER_HOST: unix:///run/openloop-docker/docker.sock
      BROKER_MODE: external
      BROKER_CONTROL_SOCKET_DIR: ${OPENLOOP_BROKER_ROOT:?}/control
      BROKER_STATE_ROOT: ${OPENLOOP_BROKER_ROOT:?}/state
      BROKER_RUNTIME_ROOT: ${OPENLOOP_BROKER_ROOT:?}/runtime
      BROKER_INGRESS_ROOT: ${OPENLOOP_BROKER_ROOT:?}/ingress
      BROKER_CHECKPOINT_RECEIPT_ROOT: ${OPENLOOP_BROKER_ROOT:?}/receipts
      BROKER_SHARED_DATA_GID: ${OPENLOOP_DATA_GID:-10777}
      BROKER_EXPECTED_APP_UID: "1000"
      BROKER_IDENTITY_ISSUER: ${BROKER_IDENTITY_ISSUER:-openloop-app}
      BROKER_IDENTITY_AUDIENCE: ${BROKER_IDENTITY_AUDIENCE:-openloop-broker}
      BROKER_EXECUTION_LEASE_SECONDS: ${BROKER_EXECUTION_LEASE_SECONDS:-900}
      BROKER_GENERATION_DEADLINE_SECONDS: ${BROKER_GENERATION_DEADLINE_SECONDS:-1800}
      BROKER_RECONCILE_INTERVAL_SECONDS: ${BROKER_RECONCILE_INTERVAL_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    command: openloop-broker
    depends_on:
      docker-socket-adapter:
        condition: service_healthy
      broker-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "openloop-broker", "--healthcheck"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped
    volumes:
      - type: volume
        source: docker-socket-adapter-data
        target: /run/openloop-docker
        read_only: true
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}/control
        target: ${OPENLOOP_BROKER_ROOT:?}/control
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}/state
        target: ${OPENLOOP_BROKER_ROOT:?}/state
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}/runtime
        target: ${OPENLOOP_BROKER_ROOT:?}/runtime
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}/ingress
        target: ${OPENLOOP_BROKER_ROOT:?}/ingress
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}/receipts
        target: ${OPENLOOP_BROKER_ROOT:?}/receipts
        read_only: true
        bind:
          create_host_path: true

  runtime:
    build: *openloop-build
    group_add:
      - ${OPENLOOP_DATA_GID:-10777}
    environment:
      BROKER_MODE: external
      BROKER_CONTROL_SOCKET_DIR: ${OPENLOOP_BROKER_ROOT:?}/control
      BROKER_RUNTIME_ROOT: ${OPENLOOP_BROKER_ROOT:?}/runtime
      BROKER_INGRESS_ROOT: ${OPENLOOP_BROKER_ROOT:?}/ingress
      BROKER_CHECKPOINT_RECEIPT_ROOT: ${OPENLOOP_BROKER_ROOT:?}/receipts
      BROKER_SHARED_DATA_GID: ${OPENLOOP_DATA_GID:-10777}
      BROKER_IDENTITY_ISSUER: ${BROKER_IDENTITY_ISSUER:-openloop-app}
      BROKER_IDENTITY_AUDIENCE: ${BROKER_IDENTITY_AUDIENCE:-openloop-broker}
      BROKER_EXECUTION_LEASE_SECONDS: ${BROKER_EXECUTION_LEASE_SECONDS:-900}
      BROKER_GENERATION_DEADLINE_SECONDS: ${BROKER_GENERATION_DEADLINE_SECONDS:-1800}
      CODING_WORKER_OPENHANDS_BROKER_ENABLED: "true"
    depends_on:
      broker:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}/control
        target: ${OPENLOOP_BROKER_ROOT:?}/control
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}/runtime
        target: ${OPENLOOP_BROKER_ROOT:?}/runtime
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}/ingress
        target: ${OPENLOOP_BROKER_ROOT:?}/ingress
        bind:
          create_host_path: true
      - type: bind
        source: ${OPENLOOP_BROKER_ROOT:?}/receipts
        target: ${OPENLOOP_BROKER_ROOT:?}/receipts
        bind:
          create_host_path: true

volumes:
  docker-socket-adapter-data:
