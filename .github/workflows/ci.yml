name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      # Three separate steps, not one `mise run check`: when this job fails, the
      # step name alone says whether it was a rule, formatting, or a type.
      - name: Lint
        run: mise run lint

      - name: Check formatting
        run: mise run format-check

      - name: Type-check
        run: mise run typecheck

  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      # Deliberately runs with no database: this is the path a contributor
      # without Docker takes, so it keeps the Postgres suites' clean-skip
      # behavior honest. The postgres job below is what actually exercises them.
      - name: Run unit and integration tests
        run: mise run test

  test-postgres:
    name: Tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # pgvector, not stock postgres: the memory store needs the `vector`
        # extension. Matches the image in docker-compose.yml.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: openloop
          # Throwaway credential for an ephemeral service container that is only
          # reachable from this job. Matches DEFAULT_DSN in tests/support/postgres.py
          # and the container `mise run test-postgres-up` provisions locally.
          POSTGRES_PASSWORD: openloop-test
          POSTGRES_DB: openloop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U openloop"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Same database as the local test container, on the runner's mapped port.
      OPENLOOP_TEST_DATABASE_URL: postgresql://openloop:openloop-test@localhost:5432/openloop_test
      # Turns the suites' "no database, skip" convenience into a hard failure, so
      # a service container that fails to come up breaks the build instead of
      # silently reducing this job to the hermetic suite.
      OPENLOOP_REQUIRE_POSTGRES: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up mise
        uses: jdx/mise-action@v2

      - name: Install dependencies
        run: mise run install

      - name: Run unit and integration tests against Postgres
        run: mise run test

      - name: Run Postgres E2E suites
        run: mise run test-postgres

  publish:
    name: Publish image
    needs: [quality, test, test-postgres]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # A job-level block replaces the workflow-level one instead of extending
    # it, so every scope this job needs is named here: without contents: read
    # the checkout fails. id-token and attestations sign the pushed digest.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    env:
      IMAGE: ghcr.io/openloop-team/openloop

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Staging, not the public tag: a failure below must not leave a handle
      # anything deploys from. run_attempt is part of the name because run_id
      # is stable across re-runs, so without it a re-run would push a second,
      # different build over a tag an earlier attempt already smoke tested.
      - name: Build and push to a staging tag
        id: build
        env:
          STAGING_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker buildx build \
            --platform linux/amd64 \
            --provenance=mode=max \
            --sbom=true \
            --build-arg OPENLOOP_BROKER_UID=10002 \
            --build-arg OPENLOOP_DATA_GID=10777 \
            --tag "$IMAGE:$STAGING_TAG" \
            --metadata-file /tmp/build-metadata.json \
            --push \
            .
          digest="$(jq -er '."containerimage.digest"' /tmp/build-metadata.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      # Qualifies the artifact, not the source: needs already required the
      # suite for this commit. The broker probe runs as the uid/gid the broker
      # composition uses, because that account's home is /nonexistent and the
      # image's default USER would not exercise it.
      - name: Smoke test the pushed digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          ref="$IMAGE@$DIGEST"
          expected="$(sed -n 's/^ARG CLAUDE_CODE_VERSION=//p' Dockerfile)"
          test -n "$expected"
          docker run --rm "$ref" openloop --help
          docker run --rm --user 10002:10777 "$ref" openloop-broker --help
          docker run --rm "$ref" python -c "import openloop.app"
          docker run --rm "$ref" claude --version | grep -F "$expected"

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/openloop-team/openloop
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          # Defaults to true here and would need artifact-metadata: write,
          # which the enumerated permissions block leaves at none. Linked
          # Artifacts is not part of this design.
          create-storage-record: false

      # Absent creates, same digest no-ops, different digest fails: a re-run
      # must not replace a digest an existing release record may already name.
      - name: Publish the commit tag
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          target="$IMAGE:main-$SHA"
          existing="$(docker buildx imagetools inspect "$target" \
            --format '{{println .Manifest.Digest}}' 2>/dev/null || true)"
          if [ -z "$existing" ]; then
            docker buildx imagetools create --tag "$target" "$IMAGE@$DIGEST"
          elif [ "$existing" != "$DIGEST" ]; then
            echo "::error::$target already points at $existing, not $DIGEST"
            exit 1
          fi

      - name: Report the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          echo "\`$IMAGE@$DIGEST\`" >> "$GITHUB_STEP_SUMMARY"
